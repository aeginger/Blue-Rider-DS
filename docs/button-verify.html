/**
 * Blue Rider Design System — Button
 *
 * Spec source: Figma Buttons page (node 1005:681), verified via MCP
 * design context on the component set:
 *   LG: 48px, padding 12/24, gap 12, radius 12 (Scale/300), 16px Semibold, 24px icons
 *   SM: 32px, padding 4/12, gap 12, radius 8 (Scale/200), 14px Semibold, 16px icons
 *
 * Consumes SEMANTIC tokens only (src/tokens/dist/tokens.css — import once
 * app-wide). No theme-specific rules: dark is default, [data-theme="light"]
 * re-maps the variables automatically.
 */

.br-button {
  /* Component tokens. Figma binds cornerRadius to Scale/300 (12px) for LG
     and Scale/200 (8px) for SM — mirrored here via the space scale. */
  --button-radius-lg: var(--br-space-sm);
  --button-radius-sm: var(--br-space-xs);
  --button-height-lg: 48px;
  --button-height-sm: 32px;

  /* Layout */
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: var(--br-space-sm);

  /* Typography — Paragraph/Bold (Instrument Sans Semibold) per Figma */
  font-family: var(--br-font-family-sans);
  font-weight: var(--br-font-weight-semibold);
  text-decoration: none;

  /* Appearance */
  border: var(--br-border-width-sm) solid transparent;
  cursor: pointer;
  outline: none;

  /* For grain overlay */
  position: relative;
  overflow: hidden;
  isolation: isolate;

  /* Transitions */
  transition:
    background-color var(--br-duration-fast) var(--br-easing-default),
    border-color var(--br-duration-fast) var(--br-easing-default),
    color var(--br-duration-fast) var(--br-easing-default),
    box-shadow var(--br-duration-fast) var(--br-easing-default),
    transform var(--br-duration-fast) var(--br-easing-default);

  user-select: none;
  -webkit-user-select: none;
}

/* ==========================================================================
   Sizes — LG (48px) and SM (32px), matching Figma exactly
   ========================================================================== */

.br-button--lg {
  min-height: var(--button-height-lg);
  padding: var(--br-space-sm) var(--br-space-lg);
  border-radius: var(--button-radius-lg);
  font-size: var(--br-font-size-med);
  line-height: 24px; /* Figma Line Height/Paragraph/MED */
}

.br-button--sm {
  min-height: var(--button-height-sm);
  padding: var(--br-space-xxs) var(--br-space-sm);
  border-radius: var(--button-radius-sm);
  font-size: var(--br-font-size-sm);
  line-height: 22px; /* Figma Line Height/Paragraph/SM */
}

.br-button--icon-only.br-button--lg {
  width: var(--button-height-lg);
  min-width: var(--button-height-lg);
  padding: 0;
}

.br-button--icon-only.br-button--sm {
  width: var(--button-height-sm);
  min-width: var(--button-height-sm);
  padding: 0;
}

/* ==========================================================================
   Grain overlay on hover
   ========================================================================== */

.br-button::after {
  content: '';
  position: absolute;
  inset: 0;
  z-index: 1;
  pointer-events: none;
  border-radius: inherit;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 512 512' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='grain'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='4' stitchTiles='stitch'/%3E%3CfeColorMatrix type='saturate' values='0'/%3E%3CfeComponentTransfer%3E%3CfeFuncR type='linear' slope='2' intercept='-0.5'/%3E%3CfeFuncG type='linear' slope='2' intercept='-0.5'/%3E%3CfeFuncB type='linear' slope='2' intercept='-0.5'/%3E%3C/feComponentTransfer%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23grain)'/%3E%3C/svg%3E");
  opacity: 0;
  mix-blend-mode: overlay;
  transition: opacity var(--br-duration-fast) var(--br-easing-default);
}

.br-button:hover:not(:disabled)::after,
.br-button.force-hover::after {
  opacity: 0.4;
}

.br-button:active:not(:disabled),
.br-button.force-active {
  transform: scale(0.98);
}

/* ==========================================================================
   Icons, label, spinner — 24px on LG, 16px on SM (per Figma)
   ========================================================================== */

.br-button__icon {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 24px;
  height: 24px;
  flex-shrink: 0;
}

.br-button--sm .br-button__icon {
  width: 16px;
  height: 16px;
}

.br-button__icon svg {
  width: 100%;
  height: 100%;
}

.br-button__label,
.br-button span {
  white-space: nowrap;
  color: inherit;
}

.br-button__spinner {
  display: inline-flex;
  align-items: center;
  justify-content: center;
}

.br-button__spinner-icon {
  width: 24px;
  height: 24px;
  animation: br-spin 1s linear infinite;
}

.br-button--sm .br-button__spinner-icon {
  width: 16px;
  height: 16px;
}

@keyframes br-spin {
  from { transform: rotate(0deg); }
  to { transform: rotate(360deg); }
}

  background-color: var(--br-color-bg-action-primary);
